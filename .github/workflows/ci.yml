name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-type-check:
    name: 'Lint & Type Check'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run Biome linting
        run: npm run lint:biome
        
      - name: Run ESLint code style enforcement
        run: npm run lint:eslint
        
      - name: Run TypeScript type checking
        run: npm run lint:types
        
      - name: Check for linting failures
        run: |
          echo "✅ All linting and type checks passed!"
          echo "🚨 Code style rules are enforced:"
          echo "  - NO 'any' types allowed"
          echo "  - NO JSX assignment to variables"
          echo "  - NO server data storage"
          echo "  - Explicit types required for all functions and variables"
          echo "  - Proper error handling patterns enforced"
          echo "  - Material Design and accessibility rules enforced"
  
  test:
    name: 'Test Suite'
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run tests
        run: npm run test:coverage
        
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/lcov.info
          fail_ci_if_error: true
  
  build:
    name: 'Build Application'
    runs-on: ubuntu-latest
    needs: [lint-and-type-check, test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build application
        run: npm run build
        
      - name: Check build success
        run: |
          echo "✅ Build completed successfully!"
          echo "🎉 All checks passed:"
          echo "  - Code style enforced with ESLint"
          echo "  - Types checked with TypeScript"
          echo "  - Tests passed"
          echo "  - Application built successfully"

  enforce-code-standards:
    name: 'Enforce Code Standards'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Check for forbidden patterns
        run: |
          echo "🔍 Checking for forbidden code patterns..."
          
          # Check for 'any' types
          if grep -r ":\s*any" src/ --include="*.ts" --include="*.tsx" | grep -v "__tests__"; then
            echo "❌ Found 'any' types in source code (not allowed):"
            grep -r ":\s*any" src/ --include="*.ts" --include="*.tsx" | grep -v "__tests__"
            exit 1
          fi
          
          # Check for JSX in variables
          if grep -r "const.*=.*<" src/ --include="*.tsx" | grep -v "React.createElement"; then
            echo "❌ Found JSX assigned to variables (not allowed):"
            grep -r "const.*=.*<" src/ --include="*.tsx" | grep -v "React.createElement"
            exit 1
          fi
          
          # Check for database imports
          if grep -r "import.*from.*prisma\|mongoose\|sequelize\|typeorm" src/; then
            echo "❌ Found database imports (not allowed):"
            grep -r "import.*from.*prisma\|mongoose\|sequelize\|typeorm" src/
            exit 1
          fi
          
          # Check for global storage usage
          if grep -r "global\." src/ --include="*.ts" --include="*.tsx"; then
            echo "❌ Found global storage usage (not allowed):"
            grep -r "global\." src/ --include="*.ts" --include="*.tsx"
            exit 1
          fi
          
          echo "✅ No forbidden patterns found!"
          
      - name: Verify code style compliance
        run: |
          echo "📋 Code style rules enforced:"
          echo "  ✅ NO 'any' types allowed"
          echo "  ✅ NO JSX assignment to variables"
          echo "  ✅ NO server data storage"
          echo "  ✅ Explicit types required"
          echo "  ✅ Proper error handling"
          echo "  ✅ Material Design compliance"
          echo "  ✅ Accessibility standards"
          echo "  ✅ Testing best practices"
